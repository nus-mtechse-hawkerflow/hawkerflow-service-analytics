service:
  title: HawkerFlow Service Analytics
  root_path: '/hawkerflow'
  port: 8083
  host: '127.0.0.1'
  allow_origins:
    - 'http://localhost:4200'
  methods:
    - 'GET'
  headers:
    - 'X-Stall-ID'
    - 'Content-Type'
  docs_url: '/docs'
  redoc_url: '/redoc'
  credentials: false

datasource:
  driver:
    package: "drivers.postgres_driver"
    driver_class: "PostgresDriver"
  database:
    driver_name: 'postgresql+psycopg2'
    name: 'hawkerflow_order_db'
    host: 'localhost'
    port: 5432
  options:
    echo: false
