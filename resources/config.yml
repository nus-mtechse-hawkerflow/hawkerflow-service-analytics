service:
  title: HawkerFlow Service Analytics
  # Not '/analytics': ad and tracker blockers refuse requests to that path
  root_path: '/analytics'
  port: 8080
  host: '0.0.0.0'
  allow_origins:
    - '*'
  methods:
    - '*'
  headers:
    - 'X-Stall-ID'
    - 'Content-Type'
  docs_url: '/docs'
  redoc_url: '/redoc'
  credentials: false

datasource:
  driver:
    package: "drivers.postgres_driver"
    driver_class: "PostgresDriver"
  database:
    driver_name: 'postgresql+psycopg2'
  options:
    echo: false
