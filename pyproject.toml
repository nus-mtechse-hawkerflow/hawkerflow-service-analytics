[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
# src/ is on the path directly, so these import as top-level packages.
known-first-party = [
  "analytics",
  "configurations",
  "dependencies",
  "drivers",
  "endpoints",
  "entities",
  "factory",
  "lifecycle",
  "models",
  "repository",
  "session",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is declared in argument defaults by design.
# B008 is a false positive for these.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
]
